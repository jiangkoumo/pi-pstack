name: publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verifier-sandbox:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --include=dev
      - name: Enforce real verifier sandbox coverage
        run: node --test scripts/verification-exec.test.mjs scripts/verifier-child.test.mjs
        env:
          PSTACK_VERIFY_REQUIRE_SANDBOX: "1"

  publish:
    needs: verifier-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify tag matches package.json
        run: |
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi
          node -e "const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); if (p.private) { console.error('::error::package.json is marked private'); process.exit(1); }"

      - name: Package and generation gates
        run: |
          timeout 180s npm test
          npm run check:generate
          npm run check:fidelity

      - name: Real Pi smoke (pinned Pi, no model calls)
        env:
          PI_PSTACK_PI_ROOT: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: |
          timeout 60s node scripts/check-pi-discovery.mjs
          timeout 60s node scripts/check-pi-commands.mjs

      - name: Publish to npm
        run: |
          NAME="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name)")"
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published; skipping"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
