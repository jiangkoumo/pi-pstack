name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Package, generation, links, and agent probes
        run: timeout 180s npm test
      - name: Generated resources are current
        run: npm run check:generate
      - name: Upstream fidelity (overall 94%, every port 70%)
        run: npm run check:fidelity

  pi-smoke:
    name: pi-smoke (${{ matrix.pi }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.pi == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        pi: ["pinned", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Install latest Pi
        if: matrix.pi == 'latest'
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest
      - name: Pi version
        run: node -p "JSON.parse(require('fs').readFileSync('node_modules/@earendil-works/pi-coding-agent/package.json','utf8')).version"
      - name: Real Pi loads every skill and registers every command (no model calls)
        env:
          PI_PSTACK_PI_ROOT: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: |
          timeout 60s node scripts/check-pi-discovery.mjs
          timeout 60s node scripts/check-pi-commands.mjs

  verifier-sandbox:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - name: Enforce real verifier sandbox coverage
        run: node --test scripts/verification-exec.test.mjs scripts/verifier-child.test.mjs
        env:
          PSTACK_VERIFY_REQUIRE_SANDBOX: "1"
